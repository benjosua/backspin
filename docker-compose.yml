services:
  backspin:
    build: .
    image: backspin:latest
    ports:
      - "2567:2567"
    environment:
      NODE_ENV: production
      PORT: 2567
      CLIENT_DIST_DIR: /app/dist
      DATABASE_URL: postgres://backspin:backspin@postgres:5432/backspin
      AUTH_SALT: change-me-auth-salt
      JWT_SECRET: change-me-jwt-secret
      SESSION_SECRET: change-me-session-secret
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: backspin
      POSTGRES_PASSWORD: backspin
      POSTGRES_DB: backspin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backspin -d backspin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
